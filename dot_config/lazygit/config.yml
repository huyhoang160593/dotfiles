customCommands:
  - key: '<c-a>'
    description: 'AI Commit Message'
    commandMenu:
      - key: 'd'
        context: 'files'
        description: 'Commit directly'
        command: 'bash $HOME/.local/bin/lazygit-generate-msg direct'
        output: terminal
      - key: 'p'
        context: 'files'
        description: 'Commit and push'
        command: 'bash $HOME/.local/bin/lazygit-generate-msg push'
        output: terminal
      - key: 'c'
        context: 'files'
        description: 'Copy to clipboard'
        command: 'bash $HOME/.local/bin/lazygit-generate-msg clipboard'
        output: popup
        outputTitle: 'AI Commit Message'
      - key: 'u'
        context: 'global'
        description: 'Undo last commit (keep staged)'
        command: 'bash $HOME/.local/bin/lazygit-generate-msg undo'
        output: terminal
